<!DOCTYPE html>
<html>
<head>
    <title>Secure Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h1 { color: #2c3e50; }
        .info { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Welcome to the Secure Page!</h1>
    <div class="info">
        <p>You have passed geographic authentication and are now viewing protected content.</p>
    </div>

    <h2>Pick a Constellation</h2>
    <div id="starmap1" style="width:100%; max-width:900px; height:600px; margin-bottom:20px;"></div>
    <div id="zodiac-result" style="font-size:1.3em; color:#2c3e50; margin-top:20px;"></div>
    <div id="starmap-error" style="color: #b30000; font-size:1.1em; margin-top:15px;"></div>

    <!--[if lt IE 9]><script src="/static/excanvas.min.js"></script><![endif]-->
    <script src="/static/stuquery.min.js"></script>
    <script src="/static/virtualsky.min.js"></script>
    <script>
    // Expose virtualsky on window (it's set on stuQuery by VirtualSky)
    if (typeof stuQuery !== 'undefined' && stuQuery.virtualsky !== 'undefined') {
        window.virtualsky = stuQuery.virtualsky;
    }
    
    // Debug: Check if virtualsky and stuQuery loaded
    console.log('After script load:');
    console.log('stuQuery:', typeof stuQuery);
    console.log('window.virtualsky type:', typeof window.virtualsky);
    console.log('All window keys with virtualsky:', Object.keys(window).filter(k => k.includes('virtual')));
    
    // Wait for DOM to be ready
    $(document).ready(function() {
        console.log('In ready handler:');
        console.log('window.virtualsky:', typeof window.virtualsky);
        
        try {
            // Make sure virtualsky exists
            if (typeof window.virtualsky !== 'function') {
                console.error('window.virtualsky is not available!');
                console.log('window keys containing sky:', Object.keys(window).filter(k => k.includes('sky')));
                throw new Error('VirtualSky library failed to load. Type: ' + typeof window.virtualsky);
            }
            
            const zodiacMap = {
                'Aries': 'Aries',
                'Taurus': 'Taurus',
                'Gemini': 'Gemini',
                'Cancer': 'Cancer',
                'Leo': 'Leo',
                'Virgo': 'Virgo',
                'Libra': 'Libra',
                'Scorpius': 'Scorpio',
                'Sagittarius': 'Sagittarius',
                'Capricornus': 'Capricorn',
                'Aquarius': 'Aquarius',
                'Pisces': 'Pisces'
            };
            
            // Create star map
            console.log('Creating star map...');
            var sky = window.virtualsky({
                id: 'starmap1',
                projection: 'stereo',
                constellations: false,
                constellationlabels: false,
                constellationboundaries: false,
                showstars: true,
                showstarlabels: false,
                showplanets: false,
                showplanetlabels: false,
                showorbits: false,
                showgalaxy: false,
                showdate: false,
                showposition: false,
                keyboard: false,
                mouse: true,
                live: false
            });
            
            console.log('Star map created successfully:', sky);
            
            // Listen for constellation clicks
            $('#starmap1').on('click', function(e) {
                console.log('Star map clicked');
            });
            
            // If using the JS API, you can add event handlers as before:
            if (typeof sky.addEventHandler === 'function') {
                sky.addEventHandler('click', function(e) {
                    if (e.constellation) {
                        const name = e.constellation.name;
                        let zodiac = zodiacMap[name];
                        let resultDiv = document.getElementById('zodiac-result');
                        if (zodiac) {
                            resultDiv.textContent = `Zodiac sign: ${zodiac}`;
                        } else {
                            resultDiv.textContent = `"${name}" is not a zodiac constellation.`;
                        }
                    }
                });
            }
        } catch (err) {
            console.error('Star map error caught:', err);
            document.getElementById('starmap-error').textContent = 'Error initializing star map: ' + err.message;
        }
    });
    </script>
</body>
</html>
