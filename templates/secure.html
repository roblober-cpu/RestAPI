<!DOCTYPE html>
<html>
<head>
    <title>Secure Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h1 { color: #2c3e50; }
        .info { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 8px; }
        #starmap1 { width: 100%; max-width: 1200px; height: 800px; margin-bottom: 20px; border: 1px solid #ccc; }
        #zodiac-result { font-size: 1.1em; color: #2c3e50; margin-top: 20px; padding: 15px; background: #f0f8ff; border-left: 4px solid #2980b9; border-radius: 4px; }
        .error { color: #b30000; font-size: 1.1em; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Welcome to the Secure Page!</h1>
    <div class="info">
        <p>You have passed geographic authentication and are now viewing protected content.</p>
    </div>

    <h2>Pick a Constellation</h2>
    <p><em>{{ location.name }} — {{ current_time }}</em></p>
    <div id="starmap1"></div>
    <div id="zodiac-result"></div>
    <div id="starmap-error" class="error"></div>

    <script src="/static/stuquery.js"></script>
    <script>
    // Get location and time data from Flask
    var locationData = {{ location | tojson }};
    var currentTime = new Date('{{ current_time }}');
    
    console.log('Page loaded, stuquery.js should be loaded');
    console.log('window.S:', typeof window.S);
    console.log('Location:', locationData);
    console.log('Time:', currentTime);
    
    // Now load virtualsky.js dynamically - this ensures S is available
    function loadVirtualSky() {
        console.log('Loading virtualsky.js, S is:', typeof window.S);
        var script = document.createElement('script');
        script.src = '/static/virtualsky.js';
        script.onload = function() {
            console.log('virtualsky.js loaded');
            initializeSky();
        };
        script.onerror = function() {
            document.getElementById('starmap-error').textContent = 'Failed to load VirtualSky library';
            console.error('Failed to load virtualsky.js');
        };
        document.head.appendChild(script);
    }
    
    // Wait a tiny bit to ensure stuquery.js is fully processed
    setTimeout(loadVirtualSky, 100);

    function initializeSky() {
        try {
            // Check if S.virtualsky is available
            if (typeof S === 'undefined' || typeof S.virtualsky !== 'function') {
                throw new Error('VirtualSky not properly initialized. S.virtualsky is not a function.');
            }

            // Zodiac constellation mapping
            var zodiacMap = {
                'Aries': 'Aries',
                'Taurus': 'Taurus',
                'Gemini': 'Gemini',
                'Cancer': 'Cancer',
                'Leo': 'Leo',
                'Virgo': 'Virgo',
                'Libra': 'Libra',
                'Scorpius': 'Scorpio',
                'Sagittarius': 'Sagittarius',
                'Capricornus': 'Capricorn',
                'Aquarius': 'Aquarius',
                'Pisces': 'Pisces'
            };

            // Initialize VirtualSky with constellation features
            var sky = S.virtualsky({
                id: 'starmap1',
                projection: 'merc',
                scale: 2.0,
                latitude: locationData ? locationData.lat : 0,
                longitude: locationData ? locationData.lng : 0,
                date: currentTime,
                constellations: true,
                constellationlabels: true,
                showstars: true,
                showstarlabels: false,
                showplanets: false,
                showplanetlabels: false,
                showdate: true,
                showposition: true,
                keyboard: false,
                mouse: true,
                live: false
            });

            console.log('VirtualSky initialized:', sky);

            // Add mouse wheel zoom functionality
            var canvas = document.getElementById('starmap1');
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                var zoomFactor = 0.1;
                var newScale = sky.scale + (e.deltaY > 0 ? -zoomFactor : zoomFactor);
                // Constrain scale between 0.5 and 5.0
                newScale = Math.max(0.5, Math.min(5.0, newScale));
                sky.scale = newScale;
                sky.draw();
            }, { passive: false });

            // Handle clicks on the star map
            sky.on('click', function(e) {
                console.log('Click event:', e);
                console.log('Click position:', e.x, e.y);
                
                // Get nearest constellation to click point
                var nearest = sky.nearestObject(e.x, e.y);
                console.log('Nearest object:', nearest);
                
                if (nearest && nearest.label) {
                    console.log('Found constellation:', nearest.label);
                    // Fetch constellation info from server
                    fetch('/api/constellation_info', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            constellation: nearest.label
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Constellation info response:', data);
                        if (data.success) {
                            var astro = data.astrology;
                            document.getElementById('zodiac-result').innerHTML = 
                                '<strong>' + astro.zodiac_sign + ' ' + astro.symbol + '</strong><br>' +
                                'Element: ' + astro.element + '<br>' +
                                'Ruling Planet: ' + astro.ruling_planet + '<br>' +
                                'Dates: ' + astro.date_range + '<br>' +
                                'Characteristics: ' + astro.characteristics;
                        } else {
                            document.getElementById('zodiac-result').textContent = 
                                '"' + nearest.label + '" is not a zodiac constellation.';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching constellation info:', error);
                        document.getElementById('zodiac-result').textContent = 
                            'Error retrieving constellation information.';
                    });
                } else {
                    console.log('No constellation found at click location');
                }
            });

        } catch (err) {
            document.getElementById('starmap-error').textContent = 
                'Error initializing star map: ' + err.message;
            console.error('VirtualSky Error:', err);
        }
    }
    </script>
</body>
</html>
